<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Dictionary</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --surface: rgba(255,255,255,0.86);
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: rgba(0,0,0,0.12);
      --accent: #0071e3;
      --pill: #f2f2f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --surface: rgba(28,28,30,0.86);
        --card: #1c1c1e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --border: rgba(255,255,255,0.16);
        --accent: #3b82f6;
        --pill: #2a2a2d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 28px; }
    .header {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(16px);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 14px 16px; display: grid; gap: 10px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand { font-weight: 700; letter-spacing: -0.02em; }
    .search { flex: 1; min-width: 220px; }
    input, textarea, button {
      font: inherit; color: inherit;
    }
    #q, #paletteInput, .note-box {
      width: 100%; border: 1px solid var(--border); border-radius: 12px;
      background: var(--card); color: var(--text);
      padding: 10px 12px;
    }
    .tabs { display: flex; gap: 8px; overflow: auto; padding-bottom: 2px; }
    .tab, .chip, .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .main { padding-top: 16px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
    .list { display: grid; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }
    .title { font-size: 14px; font-weight: 600; margin: 6px 0; font-family: ui-monospace, Menlo, monospace; }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill { background: var(--pill); border-radius: 999px; font-size: 11px; padding: 3px 8px; }
    .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border-radius: 10px; font-size: 12px; padding: 7px 10px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .note-box { margin-top: 8px; min-height: 62px; resize: vertical; font-size: 12px; }
    .empty { padding: 30px 12px; text-align: center; color: var(--muted); }
    .toast {
      position: fixed; bottom: 16px; right: 16px;
      background: var(--text); color: var(--bg);
      padding: 8px 12px; border-radius: 10px; font-size: 12px;
      opacity: 0; transform: translateY(8px); transition: .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .palette {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35);
      display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 30;
    }
    .palette.open { display: flex; }
    .palette-panel {
      width: min(680px, calc(100vw - 20px)); background: var(--card);
      border: 1px solid var(--border); border-radius: 16px; padding: 10px;
    }
    #paletteList { max-height: 50vh; overflow: auto; margin-top: 8px; display: grid; gap: 6px; }
    .palette-item { border: 1px solid var(--border); border-radius: 10px; padding: 8px; cursor: pointer; }
    @media (max-width: 720px) {
      .header-inner { gap: 8px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="row">
        <div class="brand">skill/dict</div>
        <div class="search"><input id="q" placeholder="Search skills or tags (⌘K for palette)" /></div>
      </div>
      <div class="row tabs" id="tabs"></div>
      <div class="row toolbar">
        <button id="toggleView" class="chip">Grid view</button>
        <button id="showPinned" class="chip">Show pinned</button>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <div id="skills"></div>
  </main>

  <div id="palette" class="palette" aria-hidden="true">
    <div class="palette-panel">
      <input id="paletteInput" placeholder="Jump to skill…" />
      <div id="paletteList"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "skill_dict_state_v2";
    const CATS = ["all", "visual", "frontend", "image", "backend", "context"];
    const SKILLS = [
      {id:"minimalist-ui",cat:"visual",name:"minimalist-ui",oneliner:"Editorial minimalism for clean SaaS UX.",tags:["clean","layout"],prompt:"follow minimalist-ui for [task]",install:"codex skill install minimalist-ui"},
      {id:"design-taste-frontend",cat:"visual",name:"design-taste-frontend",oneliner:"Default anti-slop premium frontend taste.",tags:["premium","ui"],prompt:"follow design-taste-frontend for [task]",install:"codex skill install design-taste-frontend"},
      {id:"frontend-ui-engineering",cat:"frontend",name:"frontend-ui-engineering",oneliner:"Responsive structure and accessibility fundamentals.",tags:["components","a11y"],prompt:"follow frontend-ui-engineering for [task]",install:"codex skill install frontend-ui-engineering"},
      {id:"web-quality-audit",cat:"frontend",name:"web-quality-audit",oneliner:"Pre-ship quality pass for performance and UX.",tags:["audit","perf"],prompt:"follow web-quality-audit for [project]",install:"codex skill install web-quality-audit"}
    ];

    const safeJSON = (text, fallback) => { try { return JSON.parse(text); } catch { return fallback; } };
    const readState = () => {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = safeJSON(raw || "{}", {});
      return {
        pins: Array.isArray(parsed.pins) ? parsed.pins : [],
        notes: parsed.notes && typeof parsed.notes === "object" ? parsed.notes : {},
        custom: Array.isArray(parsed.custom) ? parsed.custom : [],
        view: parsed.view === "list" ? "list" : "grid",
        onlyPinned: !!parsed.onlyPinned
      };
    };
    let state = readState();
    const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    const $ = (id) => document.getElementById(id);
    const toast = (msg) => { const el = $("toast"); el.textContent = msg; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1100); };
    const copyText = async (text) => {
      try { await navigator.clipboard.writeText(text); toast("Copied"); }
      catch { const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Copied"); }
    };

    let activeCat = "all";
    const allSkills = () => [...SKILLS, ...state.custom];

    const renderTabs = () => {
      $("tabs").innerHTML = CATS.map(c => `<button class="tab ${c===activeCat?"active":""}" data-cat="${c}">${c[0].toUpperCase()+c.slice(1)}</button>`).join("");
      $("tabs").querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => { activeCat = btn.dataset.cat; render(); }));
    };

    const skillCard = (s) => {
      const pinned = state.pins.includes(s.id);
      const share = `${location.origin}${location.pathname}?skill=${encodeURIComponent(s.id)}`;
      return `<article class="card" id="skill-${s.id}">
        <div class="meta"><span class="pill">${s.cat}</span><span class="pill">${pinned ? "Pinned" : "Unpinned"}</span></div>
        <div class="title">${s.name}</div>
        <div class="muted">${s.oneliner}</div>
        <div class="meta" style="margin-top:8px">${s.tags.map(t=>`<span class="pill">${t}</span>`).join("")}</div>
        <div class="actions">
          <button class="btn primary" data-copy-prompt="${s.id}">Copy prompt</button>
          <button class="btn" data-copy-install="${s.id}">Copy install</button>
          <button class="btn" data-pin="${s.id}">${pinned ? "Unpin" : "Pin"}</button>
          <button class="btn" data-share="${s.id}" data-share-url="${share}">Copy link</button>
        </div>
        <textarea class="note-box" data-note="${s.id}" placeholder="Private notes for this skill...">${(state.notes[s.id] || "").replace(/</g,"&lt;")}</textarea>
      </article>`;
    };

    const render = () => {
      renderTabs();
      const q = ($("q").value || "").toLowerCase().trim();
      let list = allSkills().filter(s => activeCat === "all" || s.cat === activeCat);
      if (state.onlyPinned) list = list.filter(s => state.pins.includes(s.id));
      if (q) list = list.filter(s => `${s.name} ${s.oneliner} ${s.tags.join(" ")}`.toLowerCase().includes(q));

      const container = $("skills");
      container.className = state.view === "list" ? "list" : "grid";
      container.innerHTML = list.length ? list.map(skillCard).join("") : `<div class="empty">No skills found.</div>`;

      $("toggleView").textContent = state.view === "list" ? "List view" : "Grid view";
      $("showPinned").classList.toggle("active", state.onlyPinned);

      container.querySelectorAll("[data-copy-prompt]").forEach(b => b.addEventListener("click", () => {
        const s = allSkills().find(x => x.id === b.dataset.copyPrompt); if (s) copyText(s.prompt);
      }));
      container.querySelectorAll("[data-copy-install]").forEach(b => b.addEventListener("click", () => {
        const s = allSkills().find(x => x.id === b.dataset.copyInstall); if (s) copyText(s.install || `codex skill install ${s.id}`);
      }));
      container.querySelectorAll("[data-pin]").forEach(b => b.addEventListener("click", () => {
        const id = b.dataset.pin;
        state.pins = state.pins.includes(id) ? state.pins.filter(x => x !== id) : [...state.pins, id];
        saveState(); render();
      }));
      container.querySelectorAll("[data-share]").forEach(b => b.addEventListener("click", () => copyText(b.dataset.shareUrl)));
      container.querySelectorAll("[data-note]").forEach(t => t.addEventListener("input", () => {
        state.notes[t.dataset.note] = t.value; saveState();
      }));
    };

    const renderPalette = (query = "") => {
      const q = query.toLowerCase().trim();
      const list = allSkills().filter(s => !q || s.name.toLowerCase().includes(q));
      $("paletteList").innerHTML = list.slice(0, 20).map(s => `<div class="palette-item" data-jump="${s.id}"><b>${s.name}</b><div class="muted">${s.oneliner}</div></div>`).join("");
      $("paletteList").querySelectorAll("[data-jump]").forEach(i => i.addEventListener("click", () => {
        const id = i.dataset.jump;
        $("palette").classList.remove("open");
        activeCat = "all";
        render();
        const node = $(`skill-${id}`);
        if (node) node.scrollIntoView({behavior:"smooth", block:"center"});
      }));
    };

    const addCustomFromURL = () => {
      const params = new URLSearchParams(location.search);
      const skillId = params.get("skill");
      const add = params.get("add");
      if (skillId) {
        setTimeout(() => {
          const el = $(`skill-${skillId}`);
          if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
        }, 60);
      }
      if (add) {
        const data = safeJSON(decodeURIComponent(add), null);
        if (data && data.id && data.name && data.oneliner) {
          const entry = { id: String(data.id), name: String(data.name), oneliner: String(data.oneliner), cat: CATS.includes(data.cat) ? data.cat : "context", tags: Array.isArray(data.tags) ? data.tags : ["custom"], prompt: String(data.prompt || `follow ${data.id} for [task]`), install: String(data.install || `codex skill install ${data.id}`) };
          state.custom = [...state.custom.filter(s => s.id !== entry.id), entry];
          saveState();
        }
      }
    };

    $("q").addEventListener("input", render);
    $("toggleView").addEventListener("click", () => { state.view = state.view === "grid" ? "list" : "grid"; saveState(); render(); });
    $("showPinned").addEventListener("click", () => { state.onlyPinned = !state.onlyPinned; saveState(); render(); });

    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        $("palette").classList.add("open");
        $("paletteInput").value = "";
        renderPalette("");
        $("paletteInput").focus();
      }
      if (e.key === "Escape") $("palette").classList.remove("open");
    });
    $("palette").addEventListener("click", (e) => { if (e.target.id === "palette") $("palette").classList.remove("open"); });
    $("paletteInput").addEventListener("input", (e) => renderPalette(e.target.value));

    addCustomFromURL();
    render();
  </script>
</body>
</html>
