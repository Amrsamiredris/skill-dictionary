<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Skill Dictionary</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#09090b;--surface:#111116;--surface2:#16161e;--border:#1c1c28;--border2:#252535;
    --text:#dddde8;--muted:#52526a;--dim:#888899;
    --purple:#6d5bff;--green:#3dd68c;--amber:#f59e0b;--red:#f87171;--blue:#38bdf8;--pink:#e879f9;
  }
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh}

  /* HEADER */
  .header{padding:18px 24px 0;position:sticky;top:0;background:var(--bg);z-index:50;border-bottom:1px solid var(--border)}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
  .logo{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;letter-spacing:.3px;flex-shrink:0}
  .logo span{color:var(--muted)}
  .stats{display:flex;gap:16px;flex-shrink:0}
  .stat{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
  .stat b{color:var(--text)}

  /* SEARCH */
  .search-wrap{position:relative;flex:1;max-width:420px}
  .search-wrap input{
    width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:6px;
    color:var(--text);padding:8px 12px 8px 32px;font-size:13px;
    font-family:'IBM Plex Mono',monospace;outline:none;transition:border-color .15s
  }
  .search-wrap input:focus{border-color:var(--purple)}
  .search-wrap input::placeholder{color:var(--muted)}
  .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}

  /* TABS */
  .tabs{display:flex;gap:1px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    background:none;border:none;border-bottom:2px solid transparent;
    color:var(--muted);padding:6px 12px 10px;font-size:11px;
    font-family:'IBM Plex Mono',monospace;cursor:pointer;letter-spacing:.3px;
    white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0
  }
  .tab.active{color:var(--text);border-bottom-color:var(--purple)}
  .tab:hover:not(.active){color:#9999b8}

  /* GRID */
  .toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;gap:12px;border-bottom:1px solid var(--border)}
  .toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mini-btn,.select{background:var(--surface);border:1px solid var(--border2);color:var(--dim);border-radius:6px;padding:7px 10px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer}
  .mini-btn.active{color:var(--text);border-color:var(--purple)}
  .select{cursor:pointer}
  .pins{display:flex;gap:8px;padding:12px 24px 0;flex-wrap:wrap}
  .pin{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:999px;padding:5px 10px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer}
  .pin .x{color:var(--muted);margin-left:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;padding:18px 24px 40px}
  .grid.list{display:block}
  .grid.list .card{margin-bottom:8px}

  /* CARD */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .2s;display:flex;flex-direction:column}
  .card:hover{border-color:var(--border2)}
  .stripe{height:2px}

  .card-body{padding:12px 14px 10px;flex:1}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
  .card-name{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;line-height:1.3;word-break:break-all}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0}
  .badge.used{color:var(--green);border-color:#1a3a2a;background:#0d2018}

  .oneliner{font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:6px}
  .when{font-size:10px;color:var(--muted);border-left:2px solid var(--border2);padding-left:7px;margin-bottom:8px;line-height:1.5}

  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
  .tag{font-size:9px;font-family:'IBM Plex Mono',monospace;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:1px 6px;letter-spacing:.2px}

  /* SOURCE */
  .source{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-bottom:8px;opacity:.6}

  /* FOOTER */
  .card-foot{padding:0 14px 12px;display:flex;gap:6px}
  .btn-copy{flex:1;background:var(--surface2);border:1px solid var(--border2);color:var(--dim);border-radius:5px;padding:7px 0;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;font-weight:500;letter-spacing:.3px;transition:all .2s}
  .btn-copy:hover{background:#1c1c2e;color:var(--text)}
  .btn-copy.copied{background:#0d2018;border-color:#1a4030;color:var(--green)}
  .btn-gh{background:none;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:7px 9px;font-size:11px;cursor:pointer;text-decoration:none;display:flex;align-items:center;transition:all .15s}
  .btn-gh:hover{border-color:var(--border2);color:var(--text)}

  .note{width:100%;margin-top:8px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--dim);padding:6px;font-size:10px;font-family:'IBM Plex Mono',monospace}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-family:'IBM Plex Mono',monospace;font-size:12px}
  .palette{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:100}
  .palette.open{display:flex}
  .palette-box{width:min(680px,92vw);background:var(--surface);border:1px solid var(--border2);border-radius:8px;overflow:hidden}
  .palette-box input{width:100%;padding:12px;border:0;border-bottom:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:'IBM Plex Mono',monospace}
  .palette-list{max-height:48vh;overflow:auto}.palette-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border)}.palette-item.active,.palette-item:hover{background:#1a1a26}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="logo">skill<span>/</span>dict</div>
    <div class="search-wrap">
      <span class="si">⌕</span>
      <input id="search" placeholder="search skills, use cases, tags..." autofocus/>
    </div>
    <div class="stats">
      <div class="stat" id="s1"><b>19</b> skills</div>
      <div class="stat" id="s2"><b>0</b> used</div>
      <div class="stat" id="s3">top: <b>—</b></div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="toolbar">
  <div class="toolbar-left">
    <button class="mini-btn" id="add-skill">+ add custom skill</button>
    <button class="mini-btn" id="view-toggle">toggle list view</button>
  </div>
  <div class="toolbar-right">
    <label for="sort" class="stat">sort</label>
    <select id="sort" class="select"><option value="default">default</option><option value="usage">most used</option><option value="recent">recent</option></select>
  </div>
</div>
<div class="pins" id="pins"></div>
<div class="grid" id="grid"></div>
<div class="palette" id="palette"><div class="palette-box"><input id="palette-search" placeholder="type a skill and press Enter to copy"/><div class="palette-list" id="palette-list"></div></div></div>

<script>

// stripe color per category
const CAT_COLOR = {visual:'#6d5bff',image:'#e879f9',frontend:'#38bdf8',backend:'#3dd68c',context:'#f59e0b',workflow:'#f87171'};

const SKILLS = [

  {
    id:'image-to-code',cat:'workflow',
    name:'image-to-code',
    oneliner:'Full pipeline: generate images → analyze → implement frontend code.',
    when:'Starting from a visual comp or screenshot. Agent builds UI from the image.',

    gh:'https://github.com/Leonxlnx/taste-skill/tree/main/skills/full-output-enforcement'
  },

    id:'vercel-deploy-claimable',cat:'workflow',
    name:'vercel-deploy-claimable',
    oneliner:'Deploy to Vercel instantly from any AI chat. Returns preview URL + claim URL.',
    when:'Ready to ship. Works from Claude Desktop, claude.ai, or any connected agent.',
    tags:['all apps','deploy','Vercel'],
    source:'vercel-labs/agent-skills',
    prompt:'follow the vercel-deploy-claimable skill. Deploy this project to Vercel.',
    gh:'https://github.com/vercel-labs/agent-skills'

];

let activeTab='all', q='', sortMode='default', listView=false;
let usage = JSON.parse(localStorage.getItem('sd_usage')||'{}');
let recent = JSON.parse(localStorage.getItem('sd_recent')||'{}');
let pins = JSON.parse(localStorage.getItem('sd_pins')||'[]');
let notes = JSON.parse(localStorage.getItem('sd_notes')||'{}');
let customSkills = JSON.parse(localStorage.getItem('sd_custom_skills')||'[]');

function saveUsage(){ localStorage.setItem('sd_usage', JSON.stringify(usage)); }
function saveRecent(){ localStorage.setItem('sd_recent', JSON.stringify(recent)); }
function savePins(){ localStorage.setItem('sd_pins', JSON.stringify(pins)); }
function saveNotes(){ localStorage.setItem('sd_notes', JSON.stringify(notes)); }
function allSkills(){ return [...SKILLS,...customSkills]; }

function filtered(){
  const lq = q.toLowerCase();
  let base = allSkills().filter(s=>{
    const catOk = activeTab==='all' || s.cat===activeTab;
    const qOk = !lq || [s.id,s.name,s.oneliner,s.when,...s.tags,s.source].join(' ').toLowerCase().includes(lq);
    return catOk && qOk;
  });
  if(sortMode==='usage') base.sort((a,b)=>(usage[b.id]||0)-(usage[a.id]||0));
  if(sortMode==='recent') base.sort((a,b)=>(recent[b.id]||0)-(recent[a.id]||0));
  return base;
}

function updateStats(){
  const usedN = Object.values(usage).filter(v=>v>0).length;
  const top = Object.entries(usage).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('s2').innerHTML=`<b>${usedN}</b> used`;
  document.getElementById('s3').innerHTML=top?`top: <b>${top[0].replace(/-/g,' ')}</b>`:`top: <b>—</b>`;
}

function renderTabs(){
  const counts = {};
  const source=allSkills();
  CATS.forEach(c=>{ counts[c.id] = c.id==='all' ? source.length : source.filter(s=>s.cat===c.id).length; });
  document.getElementById('tabs').innerHTML = CATS.map(c=>`
    <button class="tab${activeTab===c.id?' active':''}" data-cat="${c.id}">${c.label} (${counts[c.id]})</button>
  `).join('');
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    activeTab=t.dataset.cat; renderTabs(); renderGrid();
  }));
}

function renderGrid(){
  const list = filtered();
  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML=`<div class="empty">no skills match "${q}"</div>`; return; }
  grid.innerHTML = list.map(s=>{
    const u = usage[s.id]||0;
    const color = CAT_COLOR[s.cat]||'#6d5bff';
    return `
    <div class="card">
      <div class="stripe" style="background:${color}"></div>
      <div class="card-body">
        <div class="card-head">
          <div class="card-name">${s.name}</div>
          <div class="badge${u>0?' used':''}" id="b-${s.id}">${u>0?`used ${u}×`:'—'}</div>
        </div>
        <div class="oneliner">${s.oneliner}</div>
        <div class="when">↳ ${s.when}</div>
        <div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="source">${s.source}</div>
        <textarea class="note" placeholder="private note..." onchange="setNote('${s.id}', this.value)">${notes[s.id]||''}</textarea>
      </div>
      <div class="card-foot">
        <button class="btn-copy" id="c-${s.id}" onclick="copy('${s.id}')">⌘ Copy prompt</button>
        <button class="btn-gh" onclick="copyInstall('${s.id}')">npm</button>
        <button class="btn-gh" onclick="shareSkill('${s.id}')">#</button>
        <button class="btn-gh" onclick="togglePin('${s.id}')">★</button>
        <a class="btn-gh" href="${s.gh}" target="_blank">↗</a>
      </div>
    </div>`;
  }).join('');
  updateStats();
}


window.copyInstall=function(id){ navigator.clipboard.writeText(`npx skills add ${id}`).then(()=>alert('install command copied')); };
window.shareSkill=function(id){ const url=`${location.origin}${location.pathname}#skill-${id}`; navigator.clipboard.writeText(url).then(()=>alert('link copied')); };
window.setNote=function(id,val){ notes[id]=val; saveNotes(); };

window.copy = function(id){
  const s = allSkills().find(x=>x.id===id);
  navigator.clipboard.writeText(s.prompt).then(()=>{
    usage[id]=(usage[id]||0)+1; recent[id]=Date.now(); saveUsage(); saveRecent();
    const btn=document.getElementById(`c-${id}`);
    const badge=document.getElementById(`b-${id}`);
    btn.textContent='✓ Copied'; btn.classList.add('copied');
    if(badge){badge.textContent=`used ${usage[id]}×`;badge.className='badge used';}
    updateStats();
    setTimeout(()=>{btn.textContent='⌘ Copy prompt';btn.classList.remove('copied');},1800);
  });
};

function togglePin(id){ pins = pins.includes(id) ? pins.filter(x=>x!==id) : [...pins,id]; savePins(); renderPins(); renderGrid(); }
function renderPins(){
  const el=document.getElementById('pins');
  if(!pins.length){el.innerHTML=''; return;}
  el.innerHTML = pins.map(id=>{ const s=allSkills().find(x=>x.id===id); if(!s) return ''; return `<button class="pin" onclick="copy('`+id+`')">${s.name}<span class="x" onclick="event.stopPropagation();togglePin('`+id+`')">×</span></button>`; }).join('');
}
function renderPalette(){ const list=allSkills().filter(s=>[s.name,...s.tags].join(' ').toLowerCase().includes(document.getElementById('palette-search').value.toLowerCase())); const el=document.getElementById('palette-list'); el.innerHTML=list.map((s,i)=>`<div class="palette-item${i===0?' active':''}" data-id="${s.id}">${s.name} <span class="muted">${s.tags.join(', ')}</span></div>`).join(''); el.querySelectorAll('.palette-item').forEach(it=>it.onclick=()=>{copy(it.dataset.id);document.getElementById('palette').classList.remove('open');}); }

document.getElementById('search').addEventListener('input',e=>{q=e.target.value;renderGrid();});
document.getElementById('sort').addEventListener('change',e=>{sortMode=e.target.value;renderGrid();});
document.getElementById('view-toggle').addEventListener('click',()=>{listView=!listView;document.getElementById('grid').classList.toggle('list',listView);});
document.getElementById('add-skill').addEventListener('click',()=>{const name=prompt('Skill name'); if(!name) return; const id=(prompt('Skill id (slug)')||'').trim()||name.toLowerCase().replace(/[^a-z0-9]+/g,'-'); const cat=prompt('Category: visual|image|frontend|backend|context|workflow','workflow')||'workflow'; const oneliner=prompt('One-liner','Custom skill'); const when=prompt('When to use?','Anytime'); const tags=(prompt('Tags (comma separated)','custom')||'custom').split(',').map(x=>x.trim()).filter(Boolean); const source=prompt('Source','custom'); const promptText=prompt('Activation prompt','follow this skill for: [task]'); const gh=prompt('GitHub URL (optional)','')||'#'; customSkills.push({id,cat,name,oneliner,when,tags,source,prompt:promptText,gh}); localStorage.setItem('sd_custom_skills', JSON.stringify(customSkills)); renderTabs(); renderGrid();});

document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); document.getElementById('palette').classList.add('open'); document.getElementById('palette-search').value=''; renderPalette(); document.getElementById('palette-search').focus();} if(e.key==='Escape') document.getElementById('palette').classList.remove('open');});
document.getElementById('palette-search').addEventListener('input',renderPalette);
document.getElementById('palette-search').addEventListener('keydown',e=>{if(e.key==='Enter'){const first=document.querySelector('.palette-item'); if(first){copy(first.dataset.id); document.getElementById('palette').classList.remove('open');}}});
renderTabs();
renderPins();
renderGrid();
</script>
</body>
</html>
